name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustc --version
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .tools/rclone
          key: rclone-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packaging/qualification-manifest.toml') }}
      - run: scripts/fetch-rclone.sh
      - run: cargo fmt --all --check
      - run: cargo clippy --locked -p sync-core -p sync-manager -p rclone-adapter -p sync-cli --all-targets -- -D warnings
      - run: cargo test --locked -p sync-core -p sync-manager -p rclone-adapter -p sync-cli

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustc --version
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .tools/rclone
          key: rclone-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packaging/qualification-manifest.toml') }}
      - run: scripts/fetch-rclone.sh
      - run: cargo fmt --all --check
      - run: cargo clippy --locked -p sync-core -p sync-manager -p rclone-adapter -p sync-cli --all-targets -- -D warnings
      - run: cargo test --locked -p sync-core -p sync-manager -p rclone-adapter -p sync-cli
      - name: Clippy UI crate
        run: cargo clippy --locked -p nsh-app-sync-ui --all-targets -- -D warnings
      - name: Install NSH 0.6.1
        shell: bash
        env:
          NSH_VERSION: v0.6.1
        run: |
          curl -fsSL https://nsh.dev/install.sh | sh
          test "$("$HOME/.local/bin/nsh" --version)" = "nsh 0.6.1 (2f51d86)"
      - name: Build the NSH app
        working-directory: apps/sync-ui
        run: ~/.local/bin/nsh build
      - name: Test the NSH app
        shell: bash
        working-directory: apps/sync-ui
        run: |
          NSH_BIN="$HOME/.local/bin/nsh"
          export CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}"
          export RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}"
          TMP_HOME="$(mktemp -d)"
          trap 'rm -rf "$TMP_HOME"' EXIT
          # Headless UI tests assert on the demo fixtures; FOLDERSYNC_DEMO=1 selects the demo source.
          HOME="$TMP_HOME" FOLDERSYNC_STATE_DIR="$TMP_HOME/state" FOLDERSYNC_DEMO=1 "$NSH_BIN" test
      - name: Build and unit-test Finder Sync extension
        shell: bash
        run: |
          chmod +x apps/finder-extension/build.sh
          apps/finder-extension/build.sh --test

  macos-disk-images:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustc --version
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .tools/rclone
          key: rclone-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packaging/qualification-manifest.toml') }}
      - run: scripts/fetch-rclone.sh
      - name: Qualify disposable APFS disk images
        shell: bash
        env:
          FOLDERSYNC_DISK_IMAGES_CI: "1"
        run: |
          export CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}"
          export RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}"
          test_home="$(mktemp -d)"
          trap 'rmdir "$test_home"' EXIT
          HOME="$test_home" FOLDERSYNC_STATE_DIR="$test_home/state" \
            cargo test --locked -p sync-manager --test disk_images -- --ignored --nocapture --test-threads=1
